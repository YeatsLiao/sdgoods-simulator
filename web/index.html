<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F8F8F6">
  <meta name="description" content="打开 BIN，在虚拟次元屏上运行和调试。">
  <title>次元屏工作台 · SDGOODS</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/panels.css">
  <link rel="stylesheet" href="./css/debug.css">
  <link rel="stylesheet" href="./css/device.css">
  <link rel="stylesheet" href="./css/workbench-panels.css">
</head>
<body>
  <div id="app" class="app" data-phase="idle" data-panel-open="false">
    <header class="app-header">
      <a class="brand" href="./" aria-label="次元屏工作台首页">
        <span class="brand-mark official-mark" aria-hidden="true"><span>G</span><img src="./assets/brand/sdgoods-logo.webp" alt="" onerror="this.hidden=true"></span><h1>谷仓 <span class="brand-divider">·</span> 次元屏模拟器</h1>
      </a>
      <div class="header-actions"></div>
    </header>
    <main class="app-main">
      <aside class="welcome" aria-labelledby="welcome-title">
        <h2 id="welcome-title">固件</h2>
        <button id="open-firmware" class="btn btn-primary hero-open" type="button"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></svg>打开 BIN</button>
        <button id="try-sample" class="text-action hero-sample" type="button">试玩示例</button>
        <section class="sidebar-recent"><h2 id="recent-open">最近使用</h2><div id="sidebar-library"></div></section>
        <section class="sidebar-runtime"><h2>运行方式</h2><div id="sidebar-mode"></div></section>
        <div class="sidebar-bottom"><button id="mobile-recent" class="text-action" type="button">最近</button><button id="dev" data-label="开发工具" class="btn" type="button" aria-pressed="false">开发工具 <span aria-hidden="true">›</span></button></div>
      </aside>
      <section class="device-column" aria-label="虚拟次元屏">
        <div class="preview-top"><div id="firmware-meta" class="current-firmware"><span id="firmware-name">设备预览</span><span id="firmware-version" class="chip" hidden></span></div><div class="stage-status"><span id="status" class="status" role="status" aria-live="polite"><span class="status-dot" aria-hidden="true"></span><span id="status-text">未启动</span></span></div></div>
        <div class="device-stage" data-key-hint="侧键 · 空格">
          <div class="device-bezel">
            <svg class="device-shell" viewBox="0 0 1000 1000" aria-hidden="true" focusable="false">
              <image href="./assets/device/silver-shell-a.webp" width="1000" height="1000"/>
              <rect class="device-key-shade" x="849" y="150" width="18" height="128" rx="9" fill="black" transform="rotate(-38 858 214)"/>
            </svg>
            <div class="device-aperture">
              <canvas id="screen" width="360" height="360" aria-label="360 × 360 圆形触摸屏">需要浏览器支持 Canvas</canvas>
              <div id="run-cta" class="run-cta">
                <svg class="idle-mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="currentColor"/><circle cx="32" cy="32" r="12" fill="#08090a"/></svg>
                <strong id="screen-state">等待你的固件</strong><span id="screen-state-hint">打开 BIN，让次元屏亮起来</span>
              </div>
              <div id="touch-overlay" class="touch-overlay" aria-hidden="true"><span id="touch-dot" class="touch-dot"></span><span id="touch-readout" class="touch-readout">0, 0</span></div>
            </div>
            <div id="launcher-overlay" class="launcher-overlay" role="dialog" aria-modal="false" aria-labelledby="launcher-title" hidden>
              <div class="launcher-head">
                <p class="launcher-eyebrow">SDGOODS 启动器 · 模拟</p>
                <div class="launcher-title-row">
                  <h2 id="launcher-title" class="launcher-title">应用</h2>
                  <button id="launcher-close" class="btn btn-icon" type="button" aria-label="关闭启动器"></button>
                </div>
                <p id="launcher-hint" class="launcher-hint">从 OTA 槽启动已安装的应用</p>
              </div>
              <div id="launcher-list" class="launcher-list"></div>
              <p class="launcher-foot">仅模拟槽分配与 otadata；官方启动器界面由平台镜像提供</p>
            </div>
          </div>
          <button id="side" class="side-key" type="button" aria-label="按住右上方侧键" aria-describedby="device-key-hint" disabled></button>
        </div>
        <p class="device-prompt">拖入 BIN，或从左侧打开</p>
        <p id="device-key-hint" class="sr-only">触摸圆屏；右上银色侧键可短按或长按，也可按住空格。具体功能由固件决定。</p>
            <div id="error-card" class="error-card" role="alert" aria-live="assertive" hidden>
              <div class="error-head">
                <svg class="icon error-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 4.5l8.5 15h-17z"></path>
                  <path d="M12 10v4.2M12 17.2h.01"></path>
                </svg>
                <strong>运行失败</strong>
                <button id="error-close" class="btn btn-icon" type="button" aria-label="关闭错误提示"></button>
              </div>
              <p id="error-message"></p>
              <div id="error-actions" class="error-actions"></div>
            </div>


        <footer class="control-bar" role="toolbar" aria-label="设备操作">
          <button id="launcher" class="btn" type="button" hidden>启动器</button>
          <button id="restart" class="btn" type="button" title="重启设备，保留设置和进度" disabled>重启</button>

          <button id="screenshot" class="btn" type="button" aria-label="截图" title="保存截图" disabled>截图</button>
          <button id="record" class="btn" type="button" disabled>录屏</button><button id="fullscreen" class="btn" type="button" title="全屏">全屏</button>

        </footer>

      </section>
      <section id="workspace-panel" class="panel-column" aria-label="工作面板" hidden>
        <div id="dock-resize" class="dock-resize" role="separator" tabindex="0" aria-label="调整开发工具尺寸" aria-controls="workspace-panel"></div>
        <div class="panel-toolbar"><span id="workspace-panel-title">固件</span><div class="dock-actions"><button id="dock-bottom" class="btn btn-icon" type="button" aria-label="停靠下方" title="停靠下方"></button><button id="dock-right" class="btn btn-icon" type="button" aria-label="停靠右侧" title="停靠右侧"></button><button id="dock-max" class="btn btn-icon" type="button" aria-label="最大化或还原面板" title="最大化面板"></button></div><button id="panel-close" class="btn btn-icon btn-ghost" type="button" aria-label="收起工作面板">×</button></div>
        <div id="tabs" class="tabs-host"></div>
        <div id="panel-host" class="panel-host"></div>
      </section>
    </main>
    <div id="settings-extras" hidden><button id="clear-open" class="btn btn-danger" type="button" disabled>清除运行数据</button><button id="setup-open" class="btn" type="button" hidden>配网帮助</button></div>
    <div id="drop-overlay" class="drop-overlay" hidden><strong>松开，运行这个 BIN</strong><span>整机固件或纯 app 包均可</span></div>
    <input id="file" type="file" accept=".bin,application/octet-stream" hidden>
  </div>
  <dialog id="clear-dialog" class="confirm-dialog" aria-labelledby="clear-title">
    <form method="dialog"><h2 id="clear-title">清除这份固件的数据？</h2><p id="clear-description"></p><p>设置和运行进度将恢复到原始固件状态，其他固件不受影响。</p><div class="dialog-actions"><button class="btn" value="cancel" autofocus>保留数据</button><button class="btn btn-danger" value="clear">清除并重启</button></div></form>
  </dialog>
  <noscript>请启用 JavaScript 后使用模拟器。</noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
